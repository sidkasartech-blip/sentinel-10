[project]
name = "sentinel-10"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Siddhesh Kasar", email = "ksiddhesh96.sk@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.122.0",
    "beautifulsoup4>=4.15.0",
    "datasets>=5.0.1",
    "fastapi>=0.141.1",
    "jupyter>=1.1.1",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=4.14.4",
    "lxml>=6.1.1",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "ragas>=0.4.3",
    "requests>=2.34.2",
    "sentence-transformers>=5.7.0",
    "tiktoken>=0.13.0",
    "uvicorn>=0.52.3",
]

[project.scripts]
sentinel-10 = "sentinel_10:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
