# docker-compose.yml
# Run everything with: docker compose up -d
# Stop everything with: docker compose down

services:
  # Your PostgreSQL + pgvector database
  db:
    image: pgvector/pgvector:pg16
    container_name: sentinel-db
    environment:
      POSTGRES_PASSWORD: sentinel123
      POSTGRES_DB: sentinel10
    ports:
      - "5432:5432"
    volumes:
      - sentinel_data:/var/lib/postgresql/data  # persists data between restarts
  
  # pgAdmin — visual database browser
  pgadmin:
    image: dpage/pgadmin4
    container_name: sentinel-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: you@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"                               # open http://localhost:5050
    depends_on:
      - db
  
  langfuse-db:
    image: postgres:16
    container_name: langfuse-db
    environment:
      POSTGRES_PASSWORD: langfuse123
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_data:/var/lib/postgresql/data
  
  langfuse:
    image: langfuse/langfuse:2
    container_name: langfuse
    depends_on:
      - langfuse-db
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:langfuse123@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: sentinel-secret-key-change-in-prod
      NEXTAUTH_URL: http://localhost:3000
      SALT: sentinel-salt-change-in-prod

volumes:
  sentinel_data: 
  langfuse_data: # named volume so your data survives docker compose down